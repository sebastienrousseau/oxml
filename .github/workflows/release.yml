name: Release

# Publishing is done by CI, not from a laptop. A local `cargo publish`
# depends on whatever that machine happened to have checked out, and
# crates.io cannot be un-published -- only yanked.
#
# The trigger is a tag. Pushing `v0.0.7` publishes 0.0.7 and nothing
# else: the first job refuses to run if the tag disagrees with
# Cargo.toml, is not signed by a listed key, or has no release notes.
#
# Authentication is crates.io Trusted Publishing (OIDC): the runner
# proves to crates.io that it is this repository's release workflow and
# receives a token that lives for the job. No long-lived
# `CARGO_REGISTRY_TOKEN` is stored anywhere. Trusted Publishing has to
# be enabled once on the crate's settings page on crates.io, naming
# this repository and this workflow file; until then the publish step
# fails with an authentication error, and the preflight below says so.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.published.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          # The same compiler every other job validated with; `stable`
          # would mean "whatever was current on release day".
          toolchain: 1.98.0

      # A tag that disagrees with Cargo.toml publishes the wrong
      # version under the right name, and that cannot be taken back.
      - name: The tag must match the version in Cargo.toml
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          have="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="oxml") | .version')"
          if [ "$tag" != "$have" ]; then
            echo "::error::tag $tag does not match Cargo.toml $have"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing oxml $tag"

      # The tag must be an annotated tag signed by a key in
      # .github/allowed_signers, with the message the release standard
      # requires. An unsigned or lightweight tag can be pushed by
      # anyone with write access; this is what makes the tag mean
      # "the maintainer released it".
      - name: The tag must be signed by a listed key
        run: |
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          if ! git verify-tag "$GITHUB_REF_NAME"; then
            echo "::error::$GITHUB_REF_NAME is not signed by a key in .github/allowed_signers"
            exit 1
          fi
          subject="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          if [ "$subject" != "oxml $GITHUB_REF_NAME" ]; then
            echo "::error::tag message must be 'oxml $GITHUB_REF_NAME', got '$subject'"
            exit 1
          fi

      # The release page is composed from hand-written highlights plus
      # generated notes; without the highlights there is nothing to
      # say what the version means for a user.
      - name: Release notes must exist
        run: |
          notes="doc/release-notes/${GITHUB_REF_NAME#v}.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing"; exit 1; }
          grep -q '^## Highlights' "$notes" \
            || { echo "::error::$notes has no '## Highlights' section"; exit 1; }

      # crates.io versions are immutable: publishing one that already
      # exists fails. A tag can be pushed after the fact to record a
      # release, not to attempt it again.
      # crates.io rejects requests without a User-Agent identifying the
      # client; curl sends none, and a failed lookup reads as "not
      # published", which is the answer that makes the workflow do the
      # wrong thing.
      - name: Is this version already published?
        id: published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if curl -sf -H "User-Agent: oxml release workflow (https://github.com/sebastienrousseau/oxml)" "https://crates.io/api/v1/crates/oxml/$tag" >/dev/null; then
            echo "oxml $tag is already on crates.io; the registry step is skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to crates.io
    needs: preflight
    if: needs.preflight.outputs.skip == 'false'
    runs-on: ubuntu-latest
    # Trusted Publishing needs an OIDC token; nothing else is granted.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --all-features --locked
      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p oxml --locked
      # crates.io indexes asynchronously, so a publish that returned
      # success is not yet a publish anyone can depend on. The next
      # crate in the suite waits on exactly this.
      - name: Confirm it is on crates.io
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl -sf -H "User-Agent: oxml release workflow (https://github.com/sebastienrousseau/oxml)" "https://crates.io/api/v1/crates/oxml/$tag" >/dev/null; then
              echo "oxml $tag is live"; exit 0
            fi
            echo "not indexed yet ($i/30)"; sleep 10
          done
          echo "::error::oxml $tag did not appear within five minutes"
          exit 1

  release-page:
    name: GitHub release with checksums, SBOM and provenance
    needs: [preflight, publish]
    # Runs when publish succeeded, and also when it was skipped because
    # the version was already on crates.io (a tag pushed to record a
    # release still gets its page).
    if: always() && needs.preflight.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-cyclonedx@0.5.9

      # Download the immutable registry archive and verify both its
      # checksum and source commit before attaching or attesting it.
      - name: Package, SBOM and checksums
        id: assets
        run: |
          v="${{ needs.preflight.outputs.version }}"
          mkdir -p dist
          archive="oxml-$v.crate"
          curl --fail --silent --show-error --location --proto '=https' \
            "https://static.crates.io/crates/oxml/$archive" --output "dist/$archive"
          expected="$(curl --fail --silent --show-error --proto '=https' \
            -H 'User-Agent: oxml release workflow (https://github.com/sebastienrousseau/oxml)' \
            "https://crates.io/api/v1/crates/oxml/$v" \
            | jq -er --arg v "$v" '.version | select(.crate == "oxml" and .num == $v) \
              | .checksum | select(test("^[0-9a-f]{64}$"))')"
          (cd dist && printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict)
          tar -xOf "dist/$archive" "oxml-$v/.cargo_vcs_info.json" \
            | jq -e --arg sha "$GITHUB_SHA" '.git.sha1 == $sha and .git.dirty != true'
          cargo cyclonedx -p oxml --all-features --format json --override-filename "oxml-$v.cdx"
          mv "crates/oxml/oxml-$v.cdx.json" dist/
          (cd dist && sha256sum oxml-* > "oxml-$v.sha256")
          cat "dist/oxml-$v.sha256"

      # SLSA provenance for every asset: who built it, from which
      # commit, with which workflow. Verifiable with `gh attestation
      # verify <file> --repo sebastienrousseau/oxml`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # The page: hand-written highlights from doc/release-notes, the
      # generated pull-request list, and the checksums block, in the
      # format every repository in the family uses.
      - name: Compose the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.preflight.outputs.version }}"
          notes="doc/release-notes/$v.md"
          prev="$(git tag --sort=-v:refname | grep -v "^$GITHUB_REF_NAME$" | head -1)"
          {
            awk '/^## Highlights/{printing=1} printing && /^## / && !/^## Highlights/{exit} printing{print}' "$notes"
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" -f previous_tag_name="$prev" \
              --jq .body | sed -n '/^## What.s Changed/,$p' | sed '/^\*\*Full Changelog/d'
            echo
            echo '## Checksums'
            echo
            echo 'SHA-256 of every asset attached to this release:'
            echo
            echo '```text'
            cat "dist/oxml-$v.sha256"
            echo '```'
            echo
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
          } > body.md
          cat body.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "oxml $v" --notes-file body.md --verify-tag
