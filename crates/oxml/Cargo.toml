[package]
name = "oxml"
version = "0.0.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A pure Rust XML toolkit with zero unsafe code: parsing, an ergonomic tree, and XPath"
documentation = "https://docs.rs/oxml"
readme = "README.md"
keywords = ["xml", "xpath", "parser", "tree", "safe"]
categories = ["parser-implementations", "encoding", "data-structures"]
autoexamples = false
include = [
    "/benches/**",
    "/Cargo.toml",
    "/examples/**",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/src/**",
    "/tests/**",
]

[lib]
name = "oxml"
path = "src/lib.rs"
# The crate has no `#[bench]` functions, and leaving the default
# libtest bench target enabled makes `cargo bench` try to run it with
# criterion's arguments — which it does not understand:
#   error: Unrecognized option: 'warm-up-time'
bench = false

[features]
default = ["std", "xpath"]
std = []
# Provides floor/ceil/round/trunc/log10/powf, which live in `std` rather
# than `core`. Required to build `xpath` without `std`; harmless with it.
libm = ["dep:libm"]
# XPath 1.0 evaluation. Separable because the tree alone is useful, and
# a caller who only parses should not pay for the engine.
xpath = []

[dependencies]
libm = { version = "0.2", optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
quick-xml = "0.42"
roxmltree = "0.21"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "xpath"
harness = false

[[bench]]
name = "encoding"
harness = false

[[bench]]
name = "tree"
harness = false

[[bench]]
name = "entities"
harness = false

[[bench]]
name = "throughput"
harness = false

[[example]]
name = "parse_and_query"
path = "examples/parse_and_query.rs"
# The example demonstrates XPath and uses `std::error::Error`, so it is
# only meaningful with both features. Declaring that here means
# `--no-default-features` skips it instead of failing to compile.
required-features = ["std", "xpath"]

[[example]]
name = "walk_the_tree"
path = "examples/walk_the_tree.rs"
required-features = ["std"]

[[example]]
name = "read_attributes"
path = "examples/read_attributes.rs"
required-features = ["std"]

[[example]]
name = "xpath_values"
path = "examples/xpath_values.rs"
required-features = ["std", "xpath"]

[[example]]
name = "handle_errors"
path = "examples/handle_errors.rs"
required-features = ["std"]

[[example]]
name = "apply_limits"
path = "examples/apply_limits.rs"
required-features = ["std"]

[[example]]
name = "decode_bytes"
path = "examples/decode_bytes.rs"
required-features = ["std"]

[[example]]
name = "names_and_ids"
path = "examples/names_and_ids.rs"
required-features = ["std", "xpath"]

[[example]]
name = "external_entities"
path = "examples/external_entities.rs"
required-features = ["std"]

[[example]]
name = "stream_events"
path = "examples/stream_events.rs"
required-features = ["std"]

[[bench]]
name = "comparison"
path = "benches/comparison.rs"
harness = false
required-features = ["std", "xpath"]

[[test]]
name = "doc_examples"
path = "tests/doc_examples.rs"
required-features = ["std", "xpath"]

[lints]
workspace = true
