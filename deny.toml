# cargo-deny configuration.

[advisories]
yanked = "deny"

[licenses]
# The crate is dual MIT/Apache-2.0; dependencies must be compatible
# with both, which in practice means permissive.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
