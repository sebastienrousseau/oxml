[workspace]
resolver = "3"
members = ["crates/oxml"]
# The fuzz crate needs nightly and sanitizer flags; keep it out of
# ordinary builds.
exclude = ["fuzz"]

# The satellites ship from their own repositories and release in strict
# lockstep at the same `=0.0.X` version as this workspace, mirroring the
# noyalib suite:
#
#   - `oxml-cli`  → https://github.com/sebastienrousseau/oxml-cli
#   - `oxml-wasm` → https://github.com/sebastienrousseau/oxml-wasm
#   - `oxml-mcp`  → https://github.com/sebastienrousseau/oxml-mcp
#   - `oxml-lsp`  → https://github.com/sebastienrousseau/oxml-lsp
#   - `xmlschema` → https://github.com/sebastienrousseau/xmlschema
#
# `xmlschema` is the XSD member: it already exists on crates.io under a
# name that means exactly that, so it keeps its name and becomes the
# schema-validation crate rather than being repurposed into the core.

[workspace.package]
edition = "2024"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
repository = "https://github.com/sebastienrousseau/oxml"
homepage = "https://github.com/sebastienrousseau/oxml"

[workspace.lints.rust]
missing_copy_implementations = "warn"
missing_docs = "warn"
unstable_features = "warn"
unused_extern_crates = "warn"
unused_results = "warn"
missing_debug_implementations = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The tree uses index-based arena handles throughout; `usize` casts are
# intrinsic to that design and flagging every one is noise.
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
# XPath 1.0 has exactly one numeric type: IEEE 754 double. Converting
# counts and positions to `f64` is required by the specification, not a
# design slip, and every such cast here is a `usize` small enough that
# the mantissa is never the limit.
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true
